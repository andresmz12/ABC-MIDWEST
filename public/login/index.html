<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WorkTrack — Sign In</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-split">

  <!-- ── Left: Brand ────────────────────────────────────────────────────── -->
  <div class="auth-brand">
    <h1>WorkTrack</h1>
    <p class="auth-brand-tagline">Workforce Management</p>

    <div class="auth-clock" id="authClock" aria-hidden="true">
      <div class="hand hand-hour"  id="clockHour"></div>
      <div class="hand hand-min"   id="clockMin"></div>
      <div class="hand hand-sec"   id="clockSec"></div>
      <div class="auth-clock-center"></div>
    </div>
  </div>

  <!-- ── Right: Form ────────────────────────────────────────────────────── -->
  <div class="auth-form-panel">
    <div class="auth-card">
      <h2>Sign In</h2>
      <p class="auth-card-sub" id="formSub">Connecting…</p>

      <div class="auth-error" id="loginError"></div>

      <form id="loginForm">

        <!-- Workspace code field: only shown when there are multiple companies -->
        <div class="auth-field" id="workspaceField" style="display:none">
          <label for="workspaceCode">Workspace Code</label>
          <input type="text" id="workspaceCode" class="auth-input"
                 placeholder="your-workspace-code"
                 autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
          <div class="auth-inline-msg info" id="workspaceMsg"></div>
        </div>

        <div class="auth-field">
          <label for="username">Username</label>
          <input type="text" id="username" class="auth-input"
                 placeholder="Enter your username"
                 autocomplete="username" autocapitalize="none" autocorrect="off" required>
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <div class="auth-input-wrap">
            <input type="password" id="password" class="auth-input"
                   placeholder="Enter your password"
                   autocomplete="current-password" required>
            <button type="button" class="auth-input-icon" id="pwToggle" aria-label="Show password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-btn" id="loginBtn" disabled>Sign In</button>
      </form>

      <div class="auth-footer">© 2026 WorkTrack</div>
    </div>
  </div>

</div>

<script>
  // ── Redirect if already logged in ─────────────────────────────────────────
  const _tok  = localStorage.getItem('token');
  const _user = JSON.parse(localStorage.getItem('user') || 'null');
  if (_tok && _user) {
    if      (_user.role === 'super_admin') location.href = '/superadmin/';
    else if (_user.role === 'admin')       location.href = '/admin/';
    else                                   location.href = '/employee/';
  }

  // ── Analog clock ──────────────────────────────────────────────────────────
  function tickClock() {
    const now = new Date();
    const s = now.getSeconds();
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;
    document.getElementById('clockHour').style.transform = `rotate(${h * 30}deg)`;
    document.getElementById('clockMin').style.transform  = `rotate(${m * 6}deg)`;
    document.getElementById('clockSec').style.transform  = `rotate(${s * 6}deg)`;
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ── Determine login mode ──────────────────────────────────────────────────
  // resolvedSlug is set silently for single-company or after workspace validation
  let resolvedSlug = null;
  let slugDebounce = null;
  let slugReqId    = 0;

  async function init() {
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    try {
      const res = await fetch('/api/auth/companies/count');
      if (!res.ok) throw new Error('Connection error');
      const { total } = await res.json();

      if (total === 0) {
        document.getElementById('formSub').textContent = 'No active workspace found.';
        err.textContent = 'Contact your administrator.';
        err.classList.add('show');
        return;
      }

      if (total === 1) {
        // Single company — resolve silently via company-info with known slug
        // Use a single lookup without exposing names
        const r2 = await fetch('/api/auth/companies/default');
        if (r2.ok) {
          const d = await r2.json();
          resolvedSlug = d.slug;
          document.getElementById('formSub').textContent = 'Welcome back. Sign in to continue.';
        } else {
          // Fallback: show workspace field
          showWorkspaceField();
        }
      } else {
        // Multiple companies — show workspace code field (never reveals names)
        showWorkspaceField();
      }

      btn.disabled = false;
    } catch {
      document.getElementById('formSub').textContent = 'Connection error.';
      err.textContent = 'Could not reach the server. Try again.';
      err.classList.add('show');
    }
  }

  function showWorkspaceField() {
    document.getElementById('workspaceField').style.display = 'block';
    document.getElementById('formSub').textContent = 'Enter your workspace code to sign in.';
    setupWorkspaceValidation();
  }

  function setupWorkspaceValidation() {
    document.getElementById('workspaceCode').addEventListener('input', e => {
      const raw  = e.target.value;
      const slug = raw.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
      if (raw !== slug) e.target.value = slug;

      clearTimeout(slugDebounce);
      resolvedSlug = null;
      const msg   = document.getElementById('workspaceMsg');
      const input = document.getElementById('workspaceCode');

      if (!slug) {
        msg.textContent = ''; input.className = 'auth-input'; return;
      }

      msg.className = 'auth-inline-msg info';
      msg.textContent = 'Verifying…';
      input.className = 'auth-input';

      const reqId = ++slugReqId;
      slugDebounce = setTimeout(async () => {
        try {
          const res = await fetch('/api/auth/company-info?slug=' + encodeURIComponent(slug));
          if (reqId !== slugReqId) return;
          if (res.ok) {
            resolvedSlug = slug;
            input.className = 'auth-input is-valid';
            msg.className   = 'auth-inline-msg ok';
            msg.textContent = '✓ Workspace found';
          } else {
            resolvedSlug = null;
            input.className = 'auth-input is-invalid';
            msg.className   = 'auth-inline-msg err';
            msg.textContent = '✗ Workspace not found';
          }
        } catch {
          if (reqId !== slugReqId) return;
          msg.className   = 'auth-inline-msg err';
          msg.textContent = 'Connection error';
        }
      }, 600);
    });
  }

  init();

  // ── Password toggle ───────────────────────────────────────────────────────
  document.getElementById('pwToggle').addEventListener('click', () => {
    const pw  = document.getElementById('password');
    const ico = document.getElementById('eyeIcon');
    if (pw.type === 'password') {
      pw.type = 'text';
      ico.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      pw.type = 'password';
      ico.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  });

  // ── Login form ────────────────────────────────────────────────────────────
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.classList.remove('show');

    if (!resolvedSlug) {
      err.textContent = 'Please enter a valid workspace code.';
      err.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="auth-spinner"></div> Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username:     document.getElementById('username').value.trim(),
          password:     document.getElementById('password').value,
          company_slug: resolvedSlug
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      localStorage.setItem('token', data.token);
      localStorage.setItem('user',  JSON.stringify(data.user));

      if      (data.user.role === 'admin')    location.href = '/admin/';
      else if (data.user.role === 'employee') location.href = '/employee/';
      else                                    location.href = '/login/';
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.add('show');
      btn.disabled  = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
