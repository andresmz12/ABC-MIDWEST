<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WorkTrack — Sign In</title>
  <link rel="stylesheet" href="/css/auth.css">
  <style>
    /* Company picker cards */
    .company-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .company-card {
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px;
      cursor: pointer;
      text-align: center;
      transition: border-color .15s, box-shadow .15s;
      background: #fff;
    }
    .company-card:hover { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29,91,240,.08); }
    .company-card.selected { border-color: var(--blue); background: #EFF6FF; box-shadow: 0 0 0 3px rgba(29,91,240,.12); }
    .company-card-avatar {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 8px;
      font-family: 'Bricolage Grotesque', sans-serif;
    }
    .company-card-name {
      font-size: .82rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .company-card.selected .company-card-name { color: var(--blue); }
    /* Single-company pill shown in brand panel */
    .auth-brand-company {
      margin-top: 16px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: .85rem;
      color: rgba(255,255,255,.9);
      font-weight: 500;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="auth-split">

  <!-- ── Left: Brand ────────────────────────────────────────────────────── -->
  <div class="auth-brand">
    <h1>WorkTrack</h1>
    <p class="auth-brand-tagline">Workforce Management</p>
    <div class="auth-brand-company" id="brandCompany" style="display:none"></div>

    <div class="auth-clock" id="authClock" aria-hidden="true">
      <div class="hand hand-hour"  id="clockHour"></div>
      <div class="hand hand-min"   id="clockMin"></div>
      <div class="hand hand-sec"   id="clockSec"></div>
      <div class="auth-clock-center"></div>
    </div>
  </div>

  <!-- ── Right: Form ────────────────────────────────────────────────────── -->
  <div class="auth-form-panel">
    <div class="auth-card">

      <!-- Multi-company picker (hidden until needed) -->
      <div id="companyPicker" style="display:none">
        <h2>Select company</h2>
        <p class="auth-card-sub">Choose your workspace to continue.</p>
        <div class="company-grid" id="companyGrid"></div>
      </div>

      <!-- Login form -->
      <div id="loginPanel">
        <h2>Sign In</h2>
        <p class="auth-card-sub" id="formSub">Connecting…</p>

        <div class="auth-error" id="loginError"></div>

        <form id="loginForm">
          <div class="auth-field">
            <label for="username">Username</label>
            <input type="text" id="username" class="auth-input"
                   placeholder="Enter your username"
                   autocomplete="username" autocapitalize="none" autocorrect="off" required>
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <div class="auth-input-wrap">
              <input type="password" id="password" class="auth-input"
                     placeholder="Enter your password"
                     autocomplete="current-password" required>
              <button type="button" class="auth-input-icon" id="pwToggle" aria-label="Show password">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="auth-btn" id="loginBtn" disabled>Sign In</button>
        </form>
      </div>

      <div class="auth-footer">© 2026 WorkTrack</div>
    </div>
  </div>

</div>

<script>
  // ── Redirect if already logged in ─────────────────────────────────────────
  const _tok  = localStorage.getItem('token');
  const _user = JSON.parse(localStorage.getItem('user') || 'null');
  if (_tok && _user) {
    if      (_user.role === 'super_admin') location.href = '/superadmin/';
    else if (_user.role === 'admin')       location.href = '/admin/';
    else                                   location.href = '/employee/';
  }

  // ── Analog clock ──────────────────────────────────────────────────────────
  function tickClock() {
    const now = new Date();
    const s = now.getSeconds();
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;
    document.getElementById('clockHour').style.transform = `rotate(${h * 30}deg)`;
    document.getElementById('clockMin').style.transform  = `rotate(${m * 6}deg)`;
    document.getElementById('clockSec').style.transform  = `rotate(${s * 6}deg)`;
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ── Company loader ────────────────────────────────────────────────────────
  let resolvedSlug = null;

  function avatarColor(name) {
    const colors = ['#1D5BF0','#7C3AED','#059669','#DC2626','#D97706','#0891B2'];
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffffffff;
    return colors[Math.abs(h) % colors.length];
  }

  async function loadCompanies() {
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    try {
      const res = await fetch('/api/auth/companies');
      if (!res.ok) throw new Error('Could not connect to server');
      const companies = await res.json();

      if (!companies.length) {
        document.getElementById('formSub').textContent = 'No active company found.';
        err.textContent = 'No hay empresa registrada. Contacta al administrador.';
        err.classList.add('show');
        return;
      }

      if (companies.length === 1) {
        // ── Single company: silent auto-select, show name on brand panel ──
        resolvedSlug = companies[0].slug;
        document.getElementById('formSub').textContent = `Signing in to ${companies[0].name}`;
        document.getElementById('brandCompany').textContent = companies[0].name;
        document.getElementById('brandCompany').style.display = 'block';

      } else {
        // ── Multiple companies: show visual card picker ──────────────────
        const grid = document.getElementById('companyGrid');
        companies.forEach((c, i) => {
          const card = document.createElement('div');
          card.className = 'company-card' + (i === 0 ? ' selected' : '');
          card.innerHTML = `
            <div class="company-card-avatar" style="background:${avatarColor(c.name)}">${c.name.charAt(0).toUpperCase()}</div>
            <div class="company-card-name">${c.name}</div>
          `;
          card.addEventListener('click', () => {
            document.querySelectorAll('.company-card').forEach(x => x.classList.remove('selected'));
            card.classList.add('selected');
            resolvedSlug = c.slug;
            document.getElementById('formSub').textContent = `Signing in to ${c.name}`;
          });
          grid.appendChild(card);
        });

        // Auto-select first
        resolvedSlug = companies[0].slug;
        document.getElementById('formSub').textContent = `Signing in to ${companies[0].name}`;
        document.getElementById('companyPicker').style.display = 'block';
      }

      btn.disabled = false;
    } catch (ex) {
      document.getElementById('formSub').textContent = 'Error de conexión';
      err.textContent = ex.message;
      err.classList.add('show');
    }
  }

  loadCompanies();

  // ── Password toggle ───────────────────────────────────────────────────────
  document.getElementById('pwToggle').addEventListener('click', () => {
    const pw  = document.getElementById('password');
    const ico = document.getElementById('eyeIcon');
    if (pw.type === 'password') {
      pw.type = 'text';
      ico.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      pw.type = 'password';
      ico.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  });

  // ── Login form ────────────────────────────────────────────────────────────
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.classList.remove('show');

    if (!resolvedSlug) {
      err.textContent = 'No hay empresa seleccionada.';
      err.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="auth-spinner"></div> Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username:     document.getElementById('username').value.trim(),
          password:     document.getElementById('password').value,
          company_slug: resolvedSlug
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      localStorage.setItem('token', data.token);
      localStorage.setItem('user',  JSON.stringify(data.user));

      if      (data.user.role === 'admin')    location.href = '/admin/';
      else if (data.user.role === 'employee') location.href = '/employee/';
      else                                    location.href = '/login/';
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.add('show');
      btn.disabled  = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
