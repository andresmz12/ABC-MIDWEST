<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WorkTrack — Sign In</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-split">

  <!-- ── Left: Brand ──────────────────────────────────────────────── -->
  <div class="auth-brand">
    <h1>WorkTrack</h1>
    <p class="auth-brand-tagline">Workforce Management</p>
    <div class="auth-clock" id="authClock" aria-hidden="true">
      <div class="hand hand-hour" id="clockHour"></div>
      <div class="hand hand-min"  id="clockMin"></div>
      <div class="hand hand-sec"  id="clockSec"></div>
      <div class="auth-clock-center"></div>
    </div>
  </div>

  <!-- ── Right: Form ──────────────────────────────────────────────── -->
  <div class="auth-form-panel">
    <div class="auth-card">
      <h2>Sign In</h2>
      <p class="auth-card-sub" id="loginSub">Enter your credentials to continue.</p>

      <!-- Company chip (return visit) -->
      <div class="auth-company-chip" id="companyChip" style="display:none">
        <div style="font-size:1.3rem">🏢</div>
        <div class="auth-company-chip-name" id="chipName"></div>
        <button class="auth-company-chip-change" id="chipChange" type="button">Change</button>
      </div>

      <!-- Slug field (first visit / manual) -->
      <div class="auth-field" id="slugField" style="display:none">
        <label for="slugInput">Company slug</label>
        <input type="text" id="slugInput" class="auth-input"
               placeholder="your-company-slug"
               autocapitalize="none" autocorrect="off" autocomplete="off">
        <div class="auth-inline-msg" id="slugMsg"></div>
      </div>

      <div class="auth-error" id="loginError"></div>

      <form id="loginForm">
        <div class="auth-field">
          <label for="username">Username</label>
          <input type="text" id="username" class="auth-input"
                 placeholder="Enter your username"
                 autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <div class="auth-input-wrap">
            <input type="password" id="password" class="auth-input"
                   placeholder="Enter your password"
                   autocomplete="current-password" required>
            <button type="button" class="auth-input-icon" id="pwToggle" aria-label="Show password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
      </form>

      <div class="auth-links">
        New here? <a href="/register/">Register your company →</a>
      </div>
      <div class="auth-footer">© 2026 WorkTrack</div>
    </div>
  </div>

</div>

<script>
  // ── Redirect if already logged in ──────────────────────────────────────────
  const _tok  = localStorage.getItem('token');
  const _user = JSON.parse(localStorage.getItem('user') || 'null');
  if (_tok && _user) {
    if      (_user.role === 'super_admin') location.href = '/superadmin/';
    else if (_user.role === 'admin')       location.href = '/admin/';
    else                                   location.href = '/employee/';
  }

  // ── Analog clock ──────────────────────────────────────────────────────────
  function tickClock() {
    const now = new Date();
    const s = now.getSeconds();
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;
    document.getElementById('clockHour').style.transform = `rotate(${h * 30}deg)`;
    document.getElementById('clockMin').style.transform  = `rotate(${m * 6}deg)`;
    document.getElementById('clockSec').style.transform  = `rotate(${s * 6}deg)`;
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ── Slug state ────────────────────────────────────────────────────────────
  let resolvedSlug = null;
  let slugCheckTimer = null;

  function showChip(slug, companyName) {
    resolvedSlug = slug;
    document.getElementById('chipName').textContent = 'Signing in to ' + companyName;
    document.getElementById('companyChip').style.display = 'flex';
    document.getElementById('slugField').style.display   = 'none';
    document.getElementById('loginSub').textContent = 'Enter your credentials to continue.';
  }

  function showSlugField() {
    resolvedSlug = null;
    document.getElementById('companyChip').style.display = 'none';
    document.getElementById('slugField').style.display   = '';
    document.getElementById('loginSub').textContent = 'Enter your company slug to get started.';
  }

  // Chip "Change" button
  document.getElementById('chipChange').addEventListener('click', () => {
    localStorage.removeItem('wt_slug');
    localStorage.removeItem('wt_company_name');
    document.getElementById('slugInput').value = '';
    document.getElementById('slugMsg').textContent = '';
    document.getElementById('slugInput').className = 'auth-input';
    showSlugField();
    document.getElementById('slugInput').focus();
  });

  // Slug inline check (debounced)
  document.getElementById('slugInput').addEventListener('input', e => {
    const val = e.target.value.toLowerCase().replace(/[^a-z0-9-]/g, '');
    e.target.value = val;
    clearTimeout(slugCheckTimer);
    const msg = document.getElementById('slugMsg');
    const inp = document.getElementById('slugInput');
    inp.classList.remove('is-valid', 'is-invalid');
    msg.className = 'auth-inline-msg';
    msg.textContent = '';
    resolvedSlug = null;
    if (!val || val.length < 2) return;
    msg.className = 'auth-inline-msg info';
    msg.textContent = '⏳ Checking…';
    slugCheckTimer = setTimeout(async () => {
      try {
        const r = await fetch(`/api/auth/company-info?slug=${encodeURIComponent(val)}`);
        const d = await r.json();
        if (r.ok) {
          inp.classList.add('is-valid');
          msg.className = 'auth-inline-msg ok';
          msg.textContent = '✓ ' + d.name;
          resolvedSlug = val;
          localStorage.setItem('wt_slug', val);
          localStorage.setItem('wt_company_name', d.name);
        } else {
          inp.classList.add('is-invalid');
          msg.className = 'auth-inline-msg err';
          msg.textContent = '✗ Company not found';
        }
      } catch {
        msg.className = 'auth-inline-msg info';
        msg.textContent = '';
      }
    }, 600);
  });

  // On load: check localStorage or try auto-detect
  (async function initSlugState() {
    const savedSlug = localStorage.getItem('wt_slug');
    const savedName = localStorage.getItem('wt_company_name');
    if (savedSlug && savedName) {
      showChip(savedSlug, savedName);
      return;
    }
    // Try auto-detect (single-company instance)
    try {
      const r = await fetch('/api/auth/companies/default');
      if (r.ok) {
        const d = await r.json();
        const info = await fetch(`/api/auth/company-info?slug=${encodeURIComponent(d.slug)}`);
        if (info.ok) {
          const company = await info.json();
          localStorage.setItem('wt_slug', d.slug);
          localStorage.setItem('wt_company_name', company.name);
          showChip(d.slug, company.name);
          return;
        }
      }
    } catch {}
    showSlugField();
  })();

  // ── Password toggle ───────────────────────────────────────────────────────
  document.getElementById('pwToggle').addEventListener('click', () => {
    const pw  = document.getElementById('password');
    const ico = document.getElementById('eyeIcon');
    if (pw.type === 'password') {
      pw.type = 'text';
      ico.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      pw.type = 'password';
      ico.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  });

  // ── Login ─────────────────────────────────────────────────────────────────
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.classList.remove('show');
    btn.disabled = true;
    btn.innerHTML = '<div class="auth-spinner"></div> Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      localStorage.setItem('token', data.token);
      localStorage.setItem('user',  JSON.stringify(data.user));

      if      (data.user.role === 'super_admin') location.href = '/superadmin/';
      else if (data.user.role === 'admin')       location.href = '/admin/';
      else if (data.user.role === 'employee')    location.href = '/employee/';
      else                                       location.href = '/login/';
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.add('show');
      btn.disabled  = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
