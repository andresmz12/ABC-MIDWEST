<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WorkTrack — Sign In</title>
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-split">

  <!-- ── Left: Brand ────────────────────────────────────────────────────── -->
  <div class="auth-brand">
    <h1 id="brandName">WorkTrack</h1>
    <p class="auth-brand-tagline" id="brandTagline">Workforce Management</p>

    <div class="auth-clock" id="authClock" aria-hidden="true">
      <div class="hand hand-hour"  id="clockHour"></div>
      <div class="hand hand-min"   id="clockMin"></div>
      <div class="hand hand-sec"   id="clockSec"></div>
      <div class="auth-clock-center"></div>
    </div>
  </div>

  <!-- ── Right: Form ────────────────────────────────────────────────────── -->
  <div class="auth-form-panel">
    <div class="auth-card">
      <h2>Sign In</h2>
      <p class="auth-card-sub" id="formSub">Connecting…</p>

      <div class="auth-error" id="loginError"></div>

      <!-- Multi-company selector (only shown if >1 company) -->
      <div class="auth-field" id="companyField" style="display:none">
        <label for="companySelect">Company</label>
        <select id="companySelect" class="auth-input" style="height:44px;padding:0 12px;cursor:pointer"></select>
      </div>

      <form id="loginForm">
        <div class="auth-field">
          <label for="username">Username</label>
          <input type="text" id="username" class="auth-input"
                 placeholder="Enter your username"
                 autocomplete="username" autocapitalize="none" autocorrect="off" required>
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <div class="auth-input-wrap">
            <input type="password" id="password" class="auth-input"
                   placeholder="Enter your password"
                   autocomplete="current-password" required>
            <button type="button" class="auth-input-icon" id="pwToggle" aria-label="Show password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-btn" id="loginBtn" disabled>Sign In</button>
      </form>

      <div class="auth-footer">© 2026 WorkTrack</div>
    </div>
  </div>

</div>

<script>
  // ── Redirect if already logged in ─────────────────────────────────────────
  const _tok  = localStorage.getItem('token');
  const _user = JSON.parse(localStorage.getItem('user') || 'null');
  if (_tok && _user) {
    if      (_user.role === 'super_admin') location.href = '/superadmin/';
    else if (_user.role === 'admin')       location.href = '/admin/';
    else                                   location.href = '/employee/';
  }

  // ── Analog clock ──────────────────────────────────────────────────────────
  function tickClock() {
    const now = new Date();
    const s = now.getSeconds();
    const m = now.getMinutes() + s / 60;
    const h = (now.getHours() % 12) + m / 60;
    document.getElementById('clockHour').style.transform = `rotate(${h * 30}deg)`;
    document.getElementById('clockMin').style.transform  = `rotate(${m * 6}deg)`;
    document.getElementById('clockSec').style.transform  = `rotate(${s * 6}deg)`;
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ── Auto-detect company ───────────────────────────────────────────────────
  let resolvedSlug = null;
  let companies    = [];

  async function loadCompanies() {
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    try {
      const res = await fetch('/api/auth/companies');
      if (!res.ok) throw new Error('Could not connect');
      companies = await res.json();

      if (!companies.length) {
        document.getElementById('formSub').textContent = 'No active company found.';
        err.textContent = 'No hay una empresa registrada. Contacta al administrador.';
        err.classList.add('show');
        return;
      }

      if (companies.length === 1) {
        // Single company — auto-select, show name
        resolvedSlug = companies[0].slug;
        document.getElementById('brandName').textContent    = companies[0].name;
        document.getElementById('brandTagline').textContent = 'Workforce Management';
        document.getElementById('formSub').textContent      = `Iniciando sesión en ${companies[0].name}`;
      } else {
        // Multiple companies — show dropdown
        const sel = document.getElementById('companySelect');
        companies.forEach(c => {
          const o = document.createElement('option');
          o.value = c.slug; o.textContent = c.name;
          sel.appendChild(o);
        });
        resolvedSlug = sel.value;
        sel.addEventListener('change', () => { resolvedSlug = sel.value; });
        document.getElementById('companyField').style.display = 'block';
        document.getElementById('formSub').textContent = 'Select your company and sign in.';
      }

      btn.disabled = false;
    } catch (ex) {
      document.getElementById('formSub').textContent = 'Error de conexión.';
      err.textContent = ex.message;
      err.classList.add('show');
    }
  }

  loadCompanies();

  // ── Password toggle ───────────────────────────────────────────────────────
  document.getElementById('pwToggle').addEventListener('click', () => {
    const pw  = document.getElementById('password');
    const ico = document.getElementById('eyeIcon');
    if (pw.type === 'password') {
      pw.type = 'text';
      ico.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      pw.type = 'password';
      ico.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  });

  // ── Login form ────────────────────────────────────────────────────────────
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.classList.remove('show');

    if (!resolvedSlug) {
      err.textContent = 'No hay empresa seleccionada.';
      err.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="auth-spinner"></div> Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username:     document.getElementById('username').value.trim(),
          password:     document.getElementById('password').value,
          company_slug: resolvedSlug
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      localStorage.setItem('token', data.token);
      localStorage.setItem('user',  JSON.stringify(data.user));

      if      (data.user.role === 'admin')    location.href = '/admin/';
      else if (data.user.role === 'employee') location.href = '/employee/';
      else                                    location.href = '/admin/';
    } catch (ex) {
      err.textContent = ex.message;
      err.classList.add('show');
      btn.disabled  = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
