<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WorkTrack — Sign In</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%); }
    .logo-img-login { width: 80px; height: 80px; border-radius: 16px; object-fit: contain; display: block; margin: 0 auto 8px; }
    .company-slug-row { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
    .company-slug-row button { padding: 10px 14px; font-size: .85rem; white-space: nowrap; }
    .company-badge { background: #e8f0fe; color: #1a56db; border-radius: 8px; padding: 8px 12px; font-size: .9rem; font-weight: 600; margin-bottom: 12px; display: none; }
    .register-link { text-align: center; margin-top: 16px; }
    .register-link a { color: rgba(255,255,255,0.85); font-size: .9rem; text-decoration: none; }
    .register-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-logo">
      <img id="companyLogo" src="/images/WhatsApp%20Image%202026-03-15%20at%2015.01.42.jpeg" alt="Logo" class="logo-img-login" style="display:none">
      <h1 id="companyTitle">WorkTrack</h1>
      <p id="companySubtitle">Workforce Management</p>
    </div>
    <div class="login-card">
      <h2>Sign In</h2>
      <div class="alert alert-error" id="loginError"></div>

      <div id="companyBadge" class="company-badge"></div>

      <form id="loginForm">
        <div class="form-group" id="slugGroup">
          <label for="companySlug">Company Slug</label>
          <div class="company-slug-row">
            <input type="text" id="companySlug" class="form-control"
                   placeholder="your-company-slug"
                   autocomplete="off" autocapitalize="none" autocorrect="off">
            <button type="button" class="btn btn-primary" id="lookupBtn">Find</button>
          </div>
          <small style="color:var(--muted,#888);font-size:.8rem">Leave empty for super admin login</small>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control"
                 placeholder="Enter your username"
                 autocomplete="username" autocapitalize="none"
                 autocorrect="off" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control"
                 placeholder="Enter your password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
      </form>
    </div>
    <div class="register-link">
      <a href="/register/">Register your company &rarr;</a>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (token && user) {
      if (user.role === 'super_admin') window.location.href = '/superadmin/';
      else if (user.role === 'admin')  window.location.href = '/admin/';
      else                             window.location.href = '/employee/';
    }

    let resolvedSlug = null;

    // Company lookup
    document.getElementById('lookupBtn').addEventListener('click', async () => {
      const slug = document.getElementById('companySlug').value.trim().toLowerCase();
      const badge = document.getElementById('companyBadge');
      const err   = document.getElementById('loginError');
      err.classList.remove('show');

      if (!slug) {
        badge.style.display = 'none';
        resolvedSlug = null;
        document.getElementById('companyTitle').textContent = 'WorkTrack';
        document.getElementById('companySubtitle').textContent = 'Workforce Management';
        return;
      }

      try {
        const res = await fetch('/api/auth/company-info?slug=' + encodeURIComponent(slug));
        if (!res.ok) { err.textContent = 'Company not found'; err.classList.add('show'); resolvedSlug = null; return; }
        const data = await res.json();
        resolvedSlug = slug;
        badge.textContent = '✓ ' + data.name;
        badge.style.display = 'block';
        document.getElementById('companyTitle').textContent = data.name;
        document.getElementById('companySubtitle').textContent = 'Sign in to your account';
        if (data.logo_url) {
          const img = document.getElementById('companyLogo');
          img.src = data.logo_url;
          img.style.display = 'block';
        }
      } catch {
        err.textContent = 'Error looking up company';
        err.classList.add('show');
      }
    });

    // Allow Enter key in slug field to trigger lookup
    document.getElementById('companySlug').addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('lookupBtn').click(); }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      err.classList.remove('show');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      const slugInput = document.getElementById('companySlug').value.trim().toLowerCase();

      try {
        const body = {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        };
        // Include company_slug if provided (even without clicking Find)
        if (slugInput) body.company_slug = slugInput;

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        if (data.user.role === 'super_admin') window.location.href = '/superadmin/';
        else if (data.user.role === 'admin')  window.location.href = '/admin/';
        else                                  window.location.href = '/employee/';
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
