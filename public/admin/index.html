<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ABC Midwest - Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .logo-img { width: 32px; height: 32px; border-radius: 6px; object-fit: contain; vertical-align: middle; margin-right: 6px; }
    .export-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .export-row select { flex: 0 0 auto; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); font-size: .9rem; }
    .btn-export { background: #28a745; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: .9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-export:hover { background: #218838; }
    .btn-download { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); border-radius: 6px; padding: 4px 8px; font-size: .8rem; cursor: pointer; margin-left: 4px; }
    .btn-download:hover { background: var(--primary); color: #fff; }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="app-header">
    <div class="container" style="max-width:100%">
      <div>
        <!-- Logo: replace /images/logo.svg with your real logo file -->
        <h1><img src="/images/logo.svg" alt="ABC Midwest logo" class="logo-img"> ABC Midwest</h1>
        <div class="header-sub">Admin Panel</div>
      </div>
      <button class="btn-logout" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <!-- TABS -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="records">📋 Records</button>
    <button class="tab-btn" data-tab="employees">👥 Employees</button>
    <button class="tab-btn" data-tab="stores">🏪 Stores</button>
  </div>

  <!-- ── RECORDS TAB ────────────────────────────────────────────── -->
  <div id="tab-records" class="content">
    <div class="container">
      <div class="card" style="margin-top:16px">
        <!-- Filters -->
        <div class="filter-row">
          <input type="date" id="filterDate" class="form-control" placeholder="Date">
          <select id="filterEmployee" class="form-control">
            <option value="">All Employees</option>
          </select>
          <select id="filterStore" class="form-control">
            <option value="">All Stores</option>
          </select>
        </div>
        <button class="btn btn-primary" style="padding:10px;font-size:.9rem" id="filterBtn">
          🔍 Filter
        </button>
        <!-- Export -->
        <div class="export-row">
          <select id="exportFormat">
            <option value="csv">CSV</option>
            <option value="excel">Excel (.xlsx)</option>
          </select>
          <button class="btn-export" id="exportBtn">⬇ Export Records</button>
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Store</th>
                <th>Date</th>
                <th>In</th>
                <th>Out</th>
                <th>Duration</th>
                <th>Media</th>
              </tr>
            </thead>
            <tbody id="recordsBody">
              <tr><td colspan="7" style="text-align:center;padding:32px;color:var(--muted)">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ── EMPLOYEES TAB ──────────────────────────────────────────── -->
  <div id="tab-employees" class="content" style="display:none">
    <div class="container">
      <div class="card" style="margin-top:16px">
        <div class="section-header">
          <h2>Employees</h2>
          <button class="btn btn-primary btn-sm" id="newEmployeeBtn">+ Add</button>
        </div>
        <div id="employeeList">
          <div class="empty-state"><span class="empty-icon">⏳</span><p>Loading...</p></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── STORES TAB ─────────────────────────────────────────────── -->
  <div id="tab-stores" class="content" style="display:none">
    <div class="container">
      <div class="card" style="margin-top:16px">
        <div class="section-header">
          <h2>Stores</h2>
          <button class="btn btn-primary btn-sm" id="newStoreBtn">+ Add</button>
        </div>
        <div id="storeList">
          <div class="empty-state"><span class="empty-icon">⏳</span><p>Loading...</p></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── MODALS ─────────────────────────────────────────────────── -->

  <!-- Media Modal -->
  <div class="modal-overlay" id="mediaModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="mediaModalTitle">Shift Evidence</h3>
        <button class="modal-close" id="closeMediaModal">&times;</button>
      </div>
      <div class="modal-body">
        <div id="mediaInfo" style="margin-bottom:12px;font-size:.85rem;color:var(--muted)"></div>
        <div id="mediaDownloadRow" style="margin-bottom:12px;display:none">
          <button class="btn-export" id="downloadEvidenceBtn" style="font-size:.85rem;padding:8px 12px">
            ⬇ Download All Evidence (ZIP)
          </button>
        </div>
        <div id="mediaGallery"></div>
      </div>
    </div>
  </div>

  <!-- Employee Modal -->
  <div class="modal-overlay" id="employeeModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Employee</h3>
        <button class="modal-close" id="closeEmployeeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="alert alert-error" id="empError"></div>
        <div class="alert alert-success" id="empSuccess"></div>
        <form id="employeeForm">
          <div class="form-group">
            <label for="empName">Full Name</label>
            <input type="text" id="empName" class="form-control" placeholder="Jane Doe" required>
          </div>
          <div class="form-group">
            <label for="empUsername">Username</label>
            <input type="text" id="empUsername" class="form-control" placeholder="janedoe"
                   autocapitalize="none" autocorrect="off" required>
          </div>
          <div class="form-group">
            <label for="empPassword">Password</label>
            <input type="password" id="empPassword" class="form-control" placeholder="Set a password" required>
          </div>
          <button type="submit" class="btn btn-primary" id="empSubmitBtn">Create Employee</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Store Modal -->
  <div class="modal-overlay" id="storeModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="storeModalTitle">Add Store</h3>
        <button class="modal-close" id="closeStoreModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="alert alert-error" id="storeError"></div>
        <form id="storeForm">
          <div class="form-group">
            <label for="storeName">Store Name</label>
            <input type="text" id="storeName" class="form-control" placeholder="Main Street Store" required>
          </div>
          <div class="form-group">
            <label for="storeAddress">Address</label>
            <input type="text" id="storeAddress" class="form-control" placeholder="123 Main St, City, ST" required>
          </div>
          <button type="submit" class="btn btn-primary" id="storeSubmitBtn">Save Store</button>
        </form>
      </div>
    </div>
  </div>

  <script>
  (() => {
    // ── Auth ─────────────────────────────────────────────────────
    const token = localStorage.getItem('token');
    const user  = JSON.parse(localStorage.getItem('user') || 'null');
    if (!token || !user || user.role !== 'admin') {
      window.location.href = '/';
      throw '';
    }

    const api = async (path, opts = {}) => {
      const res = await fetch('/api' + path, {
        ...opts,
        headers: {
          Authorization: 'Bearer ' + token,
          ...(opts.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }),
          ...(opts.headers || {})
        }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    };

    // ── Logout ───────────────────────────────────────────────────
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear(); window.location.href = '/';
    });

    // ── Tabs ─────────────────────────────────────────────────────
    const TAB_IDS = { records: 'tab-records', employees: 'tab-employees', stores: 'tab-stores' };
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        Object.values(TAB_IDS).forEach(id => document.getElementById(id).style.display = 'none');
        const tab = btn.dataset.tab;
        document.getElementById(TAB_IDS[tab]).style.display = '';
        if (tab === 'records') loadRecords();
        if (tab === 'employees') loadEmployees();
        if (tab === 'stores') loadStores();
      });
    });

    // ── Helpers ───────────────────────────────────────────────────
    function formatTime(iso) {
      if (!iso) return '<span style="color:var(--warning)">In progress</span>';
      return new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }
    function formatDate(d) {
      return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function calcDuration(inT, outT) {
      if (!outT) return '–';
      const mins = Math.round((new Date(outT) - new Date(inT)) / 60000);
      if (mins < 60) return mins + 'm';
      return Math.floor(mins/60) + 'h ' + (mins%60) + 'm';
    }
    function escHtml(s) { return (s||'').replace(/['"<>&]/g, c => ({'\'': '&#39;', '"': '&quot;', '<': '&lt;', '>': '&gt;', '&': '&amp;'}[c])); }

    // ─────────────────────────────────────────────────────────────
    // RECORDS
    // ─────────────────────────────────────────────────────────────
    function getFilterParams() {
      const params = new URLSearchParams();
      const date  = document.getElementById('filterDate').value;
      const emp   = document.getElementById('filterEmployee').value;
      const store = document.getElementById('filterStore').value;
      if (date)  params.set('date', date);
      if (emp)   params.set('employee_id', emp);
      if (store) params.set('store_id', store);
      return params;
    }

    async function loadRecords() {
      const tbody = document.getElementById('recordsBody');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--muted)">Loading...</td></tr>';

      try {
        const records = await api('/admin/records?' + getFilterParams());
        if (!records.length) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--muted)">No records found</td></tr>';
          return;
        }
        tbody.innerHTML = records.map(r => `
          <tr>
            <td><strong>${escHtml(r.employee)}</strong></td>
            <td>${escHtml(r.store)}</td>
            <td style="white-space:nowrap">${formatDate(r.date)}</td>
            <td style="white-space:nowrap">${formatTime(r.clock_in)}</td>
            <td style="white-space:nowrap">${formatTime(r.clock_out)}</td>
            <td>${calcDuration(r.clock_in, r.clock_out)}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-sm btn-primary" onclick="viewMedia(${r.id}, '${escHtml(r.employee)}', '${escHtml(r.store)}', '${r.date}')">
                📷 ${r.media_count}
              </button>
              <button class="btn-download" title="Download evidence ZIP" onclick="downloadEvidence(${r.id})">
                ⬇ ZIP
              </button>
            </td>
          </tr>
        `).join('');
      } catch(ex) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--danger)">${ex.message}</td></tr>`;
      }
    }

    document.getElementById('filterBtn').addEventListener('click', loadRecords);

    // ── Export ────────────────────────────────────────────────────
    document.getElementById('exportBtn').addEventListener('click', () => {
      const params = getFilterParams();
      const format = document.getElementById('exportFormat').value;
      params.set('format', format);
      const url = '/api/admin/records/export?' + params;
      const a = document.createElement('a');
      a.href = url;
      a.setAttribute('download', '');
      // Pass auth header via a hidden fetch → blob download
      fetch(url, { headers: { Authorization: 'Bearer ' + token } })
        .then(r => {
          if (!r.ok) throw new Error('Export failed');
          const cd = r.headers.get('content-disposition') || '';
          const fnMatch = cd.match(/filename="([^"]+)"/);
          const filename = fnMatch ? fnMatch[1] : (format === 'excel' ? 'records.xlsx' : 'records.csv');
          return r.blob().then(blob => ({ blob, filename }));
        })
        .then(({ blob, filename }) => {
          const blobUrl = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = blobUrl;
          link.download = filename;
          link.click();
          URL.revokeObjectURL(blobUrl);
        })
        .catch(err => alert('Export failed: ' + err.message));
    });

    // ── Download Evidence ─────────────────────────────────────────
    window.downloadEvidence = (recordId) => {
      fetch(`/api/admin/records/${recordId}/media/download`, {
        headers: { Authorization: 'Bearer ' + token }
      }).then(r => {
        if (!r.ok) return r.json().then(d => { throw new Error(d.error || 'Download failed'); });
        const cd = r.headers.get('content-disposition') || '';
        const fnMatch = cd.match(/filename="([^"]+)"/);
        const filename = fnMatch ? fnMatch[1] : 'evidence.zip';
        return r.blob().then(blob => ({ blob, filename }));
      }).then(({ blob, filename }) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
      }).catch(err => alert(err.message));
    };

    // Populate filter dropdowns
    async function populateFilters() {
      const [emps, stores] = await Promise.all([
        api('/admin/employees'),
        api('/admin/stores')
      ]);
      const empSel   = document.getElementById('filterEmployee');
      const storeSel = document.getElementById('filterStore');
      empSel.innerHTML   = '<option value="">All Employees</option>' + emps.map(e => `<option value="${e.id}">${escHtml(e.name)}</option>`).join('');
      storeSel.innerHTML = '<option value="">All Stores</option>'    + stores.map(s => `<option value="${s.id}">${escHtml(s.name)}</option>`).join('');
    }

    // ─────────────────────────────────────────────────────────────
    // MEDIA VIEWER
    // ─────────────────────────────────────────────────────────────
    let currentMediaRecordId = null;

    window.viewMedia = async (recordId, employee, store, date) => {
      currentMediaRecordId = recordId;
      const modal   = document.getElementById('mediaModal');
      const gallery = document.getElementById('mediaGallery');
      const info    = document.getElementById('mediaInfo');
      const dlRow   = document.getElementById('mediaDownloadRow');
      document.getElementById('mediaModalTitle').textContent = 'Shift Evidence';
      info.innerHTML = `<strong>${escHtml(employee)}</strong> &bull; ${escHtml(store)} &bull; ${formatDate(date)}`;
      gallery.innerHTML = '<div class="empty-state"><span class="empty-icon">⏳</span><p>Loading...</p></div>';
      dlRow.style.display = 'none';
      modal.classList.add('open');

      try {
        const media = await api(`/admin/records/${recordId}/media`);
        if (!media.length) {
          gallery.innerHTML = '<div class="empty-state"><span class="empty-icon">📷</span><p>No media uploaded</p></div>';
          return;
        }
        dlRow.style.display = '';
        const inMedia  = media.filter(m => m.type === 'clock_in');
        const outMedia = media.filter(m => m.type === 'clock_out');

        let html = '';
        if (inMedia.length) {
          html += `<p style="font-size:.85rem;font-weight:700;color:#28a745;margin-bottom:8px">▶ Clock In Evidence (${inMedia.length} file${inMedia.length>1?'s':''})</p>`;
          html += '<div class="media-grid">' + inMedia.map(m => mediaThumb(m)).join('') + '</div>';
        }
        if (outMedia.length) {
          html += `<p style="font-size:.85rem;font-weight:700;color:#dc3545;margin-top:16px;margin-bottom:8px">⏹ Clock Out Evidence (${outMedia.length} file${outMedia.length>1?'s':''})</p>`;
          html += '<div class="media-grid">' + outMedia.map(m => mediaThumb(m)).join('') + '</div>';
        }
        gallery.innerHTML = html;
      } catch {
        gallery.innerHTML = '<div class="empty-state"><p>Failed to load media</p></div>';
      }
    };

    function mediaUrl(m) {
      return m.url || `/uploads/${m.filename}`;
    }

    function mediaThumb(m) {
      const url = mediaUrl(m);
      const isVideo = m.mime_type.startsWith('video/');
      return `<div class="media-thumb" title="${escHtml(m.original_name)}">
        <div onclick="window.open('${escHtml(url)}','_blank')" style="cursor:pointer">
          ${isVideo
            ? `<video src="${escHtml(url)}" muted></video>`
            : `<img src="${escHtml(url)}" alt="" loading="lazy">`}
        </div>
        <div class="media-label ${m.type === 'clock_in' ? 'clock-in' : 'clock-out'}">${m.type === 'clock_in' ? 'In' : 'Out'}</div>
        <a href="${escHtml(url)}" download="${escHtml(m.original_name)}" target="_blank"
           style="display:block;text-align:center;font-size:.75rem;padding:3px 0;color:var(--primary)">⬇ Download</a>
      </div>`;
    }

    document.getElementById('downloadEvidenceBtn').addEventListener('click', () => {
      if (currentMediaRecordId) downloadEvidence(currentMediaRecordId);
    });

    document.getElementById('closeMediaModal').addEventListener('click', () => document.getElementById('mediaModal').classList.remove('open'));
    document.getElementById('mediaModal').addEventListener('click', e => { if (e.target === document.getElementById('mediaModal')) document.getElementById('mediaModal').classList.remove('open'); });

    // ─────────────────────────────────────────────────────────────
    // EMPLOYEES
    // ─────────────────────────────────────────────────────────────
    async function loadEmployees() {
      const el = document.getElementById('employeeList');
      el.innerHTML = '<div class="empty-state"><span class="empty-icon">⏳</span><p>Loading...</p></div>';
      try {
        const emps = await api('/admin/employees');
        if (!emps.length) {
          el.innerHTML = '<div class="empty-state"><span class="empty-icon">👥</span><p>No employees yet</p></div>';
          return;
        }
        el.innerHTML = emps.map(e => `
          <div class="list-item">
            <div class="list-item-info">
              <div class="list-item-name">${escHtml(e.name)}</div>
              <div class="list-item-sub">@${escHtml(e.username)}</div>
            </div>
            <div class="list-item-actions">
              <button class="btn btn-sm btn-danger" onclick="deleteEmployee(${e.id}, '${escHtml(e.name)}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch {
        el.innerHTML = '<div class="empty-state"><p>Failed to load</p></div>';
      }
    }

    window.deleteEmployee = async (id, name) => {
      if (!confirm(`Delete employee "${name}"?`)) return;
      try {
        await api(`/admin/employees/${id}`, { method: 'DELETE' });
        loadEmployees();
      } catch(ex) { alert(ex.message); }
    };

    document.getElementById('newEmployeeBtn').addEventListener('click', () => {
      document.getElementById('empError').classList.remove('show');
      document.getElementById('empSuccess').classList.remove('show');
      document.getElementById('employeeForm').reset();
      document.getElementById('employeeModal').classList.add('open');
    });
    document.getElementById('closeEmployeeModal').addEventListener('click', () => document.getElementById('employeeModal').classList.remove('open'));
    document.getElementById('employeeModal').addEventListener('click', e => { if (e.target === document.getElementById('employeeModal')) document.getElementById('employeeModal').classList.remove('open'); });

    document.getElementById('employeeForm').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = document.getElementById('empError');
      const sucEl = document.getElementById('empSuccess');
      errEl.classList.remove('show');
      sucEl.classList.remove('show');
      const btn = document.getElementById('empSubmitBtn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

      try {
        const data = await api('/admin/employees', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('empName').value.trim(),
            username: document.getElementById('empUsername').value.trim(),
            password: document.getElementById('empPassword').value
          })
        });
        sucEl.textContent = `Employee "${data.name}" created successfully.`;
        sucEl.classList.add('show');
        document.getElementById('employeeForm').reset();
        loadEmployees();
        populateFilters();
      } catch(ex) {
        errEl.textContent = ex.message;
        errEl.classList.add('show');
      } finally {
        btn.disabled = false; btn.textContent = 'Create Employee';
      }
    });

    // ─────────────────────────────────────────────────────────────
    // STORES
    // ─────────────────────────────────────────────────────────────
    let editingStoreId = null;

    async function loadStores() {
      const el = document.getElementById('storeList');
      el.innerHTML = '<div class="empty-state"><span class="empty-icon">⏳</span><p>Loading...</p></div>';
      try {
        const stores = await api('/admin/stores');
        if (!stores.length) {
          el.innerHTML = '<div class="empty-state"><span class="empty-icon">🏪</span><p>No stores yet</p></div>';
          return;
        }
        el.innerHTML = stores.map(s => `
          <div class="list-item">
            <div class="list-item-info">
              <div class="list-item-name">${escHtml(s.name)}</div>
              <div class="list-item-sub">${escHtml(s.address)}</div>
            </div>
            <div class="list-item-actions">
              <button class="btn btn-sm btn-outline" onclick="editStore(${s.id}, '${escHtml(s.name)}', '${escHtml(s.address)}')">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteStore(${s.id}, '${escHtml(s.name)}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch {
        el.innerHTML = '<div class="empty-state"><p>Failed to load</p></div>';
      }
    }

    window.editStore = (id, name, address) => {
      editingStoreId = id;
      document.getElementById('storeModalTitle').textContent = 'Edit Store';
      document.getElementById('storeName').value    = name;
      document.getElementById('storeAddress').value = address;
      document.getElementById('storeError').classList.remove('show');
      document.getElementById('storeSubmitBtn').textContent = 'Update Store';
      document.getElementById('storeModal').classList.add('open');
    };

    window.deleteStore = async (id, name) => {
      if (!confirm(`Delete store "${name}"?`)) return;
      try {
        await api(`/admin/stores/${id}`, { method: 'DELETE' });
        loadStores();
        populateFilters();
      } catch(ex) { alert(ex.message); }
    };

    document.getElementById('newStoreBtn').addEventListener('click', () => {
      editingStoreId = null;
      document.getElementById('storeModalTitle').textContent = 'Add Store';
      document.getElementById('storeForm').reset();
      document.getElementById('storeSubmitBtn').textContent = 'Save Store';
      document.getElementById('storeError').classList.remove('show');
      document.getElementById('storeModal').classList.add('open');
    });
    document.getElementById('closeStoreModal').addEventListener('click', () => document.getElementById('storeModal').classList.remove('open'));
    document.getElementById('storeModal').addEventListener('click', e => { if (e.target === document.getElementById('storeModal')) document.getElementById('storeModal').classList.remove('open'); });

    document.getElementById('storeForm').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = document.getElementById('storeError');
      errEl.classList.remove('show');
      const btn = document.getElementById('storeSubmitBtn');
      const origText = btn.textContent;
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

      try {
        const payload = {
          name: document.getElementById('storeName').value.trim(),
          address: document.getElementById('storeAddress').value.trim()
        };
        if (editingStoreId) {
          await api(`/admin/stores/${editingStoreId}`, { method: 'PUT', body: JSON.stringify(payload) });
        } else {
          await api('/admin/stores', { method: 'POST', body: JSON.stringify(payload) });
        }
        document.getElementById('storeModal').classList.remove('open');
        loadStores();
        populateFilters();
      } catch(ex) {
        errEl.textContent = ex.message;
        errEl.classList.add('show');
      } finally {
        btn.disabled = false; btn.textContent = origText;
      }
    });

    // ── Init ──────────────────────────────────────────────────────
    populateFilters().then(() => loadRecords());
  })();
  </script>
</body>
</html>
